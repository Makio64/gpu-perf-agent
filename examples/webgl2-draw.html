<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL2 Report Example</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: #101316;
        overflow: hidden;
      }

      canvas {
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module">
      import { trackWebGL2Context } from "../src/browser/allocation-tracker.js";
      import { createWebGL2Timer } from "../src/browser/timing.js";

      const canvas = document.querySelector("#stage");
      const gl = canvas.getContext("webgl2", { antialias: false });
      if (!gl) {
        throw new Error("WebGL2 is not available.");
      }

      const tracker = trackWebGL2Context(gl);
      const timer = createWebGL2Timer(gl);
      globalThis.__gpuMemoryTracker = tracker;

      const vertexShader = shader(gl.VERTEX_SHADER, `#version 300 es
        in vec2 position;
        void main() {
          gl_Position = vec4(position, 0.0, 1.0);
        }
      `);
      const fragmentShader = shader(gl.FRAGMENT_SHADER, `#version 300 es
        precision highp float;
        uniform float t;
        out vec4 color;
        void main() {
          vec2 p = gl_FragCoord.xy / vec2(1280.0, 720.0);
          color = vec4(0.35 + 0.35 * sin(t + p.xyx * 8.0), 1.0);
        }
      `);
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
        -1, -1,
        3, -1,
        -1, 3
      ]), gl.STATIC_DRAW);

      const position = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const timeUniform = gl.getUniformLocation(program, "t");

      function shader(type, source) {
        const item = gl.createShader(type);
        gl.shaderSource(item, source);
        gl.compileShader(item);
        if (!gl.getShaderParameter(item, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(item));
        }
        return item;
      }

      function resize() {
        const width = Math.max(1, Math.floor(innerWidth * devicePixelRatio));
        const height = Math.max(1, Math.floor(innerHeight * devicePixelRatio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      function draw(time) {
        resize();
        gl.uniform1f(timeUniform, time * 0.001);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(resolve));
      }

      globalThis.__gpuReportBench = async ({ durationMs, phase }) => {
        const started = performance.now();
        const frames = [];
        while (performance.now() - started < durationMs) {
          const time = await nextFrame();
          draw(time);
          frames.push(time);
        }

        const gpuTimeNs = timer ? await timer.measure(() => draw(performance.now())) : null;
        const deltas = [];
        for (let index = 1; index < frames.length; index += 1) {
          deltas.push(frames[index] - frames[index - 1]);
        }

        const elapsedMs = Math.max(0.001, frames[frames.length - 1] - frames[0]);
        return {
          api: "webgl2",
          fps: (frames.length - 1) / (elapsedMs / 1000),
          frameCount: frames.length,
          frameTimeMs: sampleStats(deltas),
          gpuTimeNs,
          phase,
          timerQueryAvailable: Boolean(timer),
          trackedGpuMemory: tracker.snapshot()
        };
      };

      function sampleStats(values) {
        const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
        const mean = sorted.reduce((total, value) => total + value, 0) / Math.max(1, sorted.length);
        return {
          count: sorted.length,
          max: sorted.at(-1) || 0,
          mean,
          min: sorted[0] || 0
        };
      }

      requestAnimationFrame(draw);
    </script>
  </body>
</html>
