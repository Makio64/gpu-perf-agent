<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas><script type="module">
const canvas = document.getElementById("c");
canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio;
const gl = canvas.getContext("webgl2");
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
const p = gl.createProgram();
gl.attachShader(p, sh(gl.VERTEX_SHADER, "#version 300 es\nvoid main(){ vec2 v[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3)); gl_Position=vec4(v[gl_VertexID],0,1);}"));
gl.attachShader(p, sh(gl.FRAGMENT_SHADER, "#version 300 es\nprecision highp float; out vec4 c; void main(){ vec2 v = gl_FragCoord.xy * 0.001; for (int i = 0; i < 2000; i++) { v = vec2(sin(v.x * 1.1 + v.y), cos(v.y * 0.9 - v.x)); } c = vec4(v, 0.5, 1); }"));
gl.linkProgram(p); gl.useProgram(p);
gl.viewport(0, 0, canvas.width, canvas.height);
function loop() { gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
