<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const canvas = document.getElementById("c");
canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio;
const ctx = canvas.getContext("webgpu"); const format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format, alphaMode: "opaque" });
const ITERS = 2000;
const shade = device.createShaderModule({ code: `
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { let p = array(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3)); return vec4f(p[i], 0, 1); }
@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f { var v = pos.xy * 0.001; for (var i = 0; i < ${ITERS}; i++) { v = vec2f(sin(v.x * 1.1 + v.y), cos(v.y * 0.9 - v.x)); } return vec4f(v, 0.5, 1); }` });
const sim = device.createShaderModule({ code: `@group(0) @binding(0) var<storage, read_write> d: array<f32>;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3u) { var x = d[id.x]; for (var i = 0; i < 64; i++) { x = sin(x) + 0.5; } d[id.x] = x; }` });
const pipe = device.createRenderPipeline({ layout: "auto", vertex: { module: shade }, fragment: { module: shade, targets: [{ format }] } });
const cpipe = device.createComputePipeline({ layout: "auto", compute: { module: sim } });
const buf = device.createBuffer({ size: 4 * 262144, usage: GPUBufferUsage.STORAGE });
const bg = device.createBindGroup({ layout: cpipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: buf } }] });
function frame() {
  const enc = device.createCommandEncoder();
  const cp = enc.beginComputePass({ label: "sim" }); cp.setPipeline(cpipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(4096); cp.end();
  const rp = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: [0,0,0,1] }] });
  rp.setPipeline(pipe); rp.draw(3); rp.end();
  device.queue.submit([enc.finish()]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
