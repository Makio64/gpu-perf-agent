<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="c" width="64" height="64"></canvas>
<script type="module">
// The hook is installed after a module's top-level await (asset loading), which finishes well after `load`.
await new Promise((resolve) => setTimeout(resolve, 800));
const gl = document.getElementById("c").getContext("webgl2");
globalThis.__gpuReportBench = async () => ({ tla: true });
function loop() { gl.clearColor(0.2, 0.3, 0.4, 1); gl.clear(gl.COLOR_BUFFER_BIT); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
