<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="c" width="256" height="256"></canvas><script>
const gl = document.getElementById("c").getContext("webgl2"); let tick = 0;
function loop() { if ((tick++ & 1) === 0) { gl.clearColor(Math.random(), 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.POINTS, 0, 1); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
