<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>48 passes</title></head>
<body style="margin:0;background:#000">
<canvas id="c" width="256" height="256"></canvas>
<script type="module">
// 48 trivial render passes per frame (one triangle into a 16x16 target, the last into the canvas).
// The hook reports the mean CPU time of encode + submit per frame, for the L1a per-pass CPU cost check.
const PASSES = 48;
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const context = document.getElementById("c").getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format, alphaMode: "opaque" });
const module = device.createShaderModule({ code: `
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
  return vec4f(p[i], 0, 1);
}
@fragment fn fs() -> @location(0) vec4f { return vec4f(0.2, 0.4, 0.6, 1); }` });
const pipeline = device.createRenderPipeline({ layout: "auto", vertex: { module }, fragment: { module, targets: [{ format }] } });
const target = device.createTexture({ size: [16, 16], format, usage: GPUTextureUsage.RENDER_ATTACHMENT });
const targetView = target.createView();
const encodeMs = [];
function frame() {
  const started = performance.now();
  const encoder = device.createCommandEncoder();
  for (let index = 0; index < PASSES; index += 1) {
    const view = index === PASSES - 1 ? context.getCurrentTexture().createView() : targetView;
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view, loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
    pass.setPipeline(pipeline);
    pass.draw(3);
    pass.end();
  }
  device.queue.submit([encoder.finish()]);
  encodeMs.push(performance.now() - started);
  if (encodeMs.length > 4096) encodeMs.shift();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
globalThis.__gpuReportBench = async ({ durationMs }) => {
  const from = encodeMs.length;
  await new Promise((resolve) => setTimeout(resolve, durationMs));
  const values = encodeMs.slice(from);
  return { encodeMeanMs: values.reduce((total, value) => total + value, 0) / Math.max(1, values.length), encodeFrames: values.length };
};
</script>
</body>
</html>
