<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
// Valid-looking render loop where every frame fails validation (missing bind group) -> renders nothing.
const BROKEN = new URLSearchParams(location.search).get("broken") !== "0";
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const canvas = document.getElementById("c");
const ctx = canvas.getContext("webgpu"); const format = navigator.gpu.getPreferredCanvasFormat();
canvas.width = 1280; canvas.height = 720; ctx.configure({ device, format });
const module = device.createShaderModule({ code: `
@group(0) @binding(0) var<uniform> u: vec4f;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { var p = array(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3)); return vec4f(p[i], 0, 1); }
@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f { var c = 0.0; for (var i = 0; i < 200; i++) { c += sin(pos.x * 0.01 + f32(i) * u.x); } return vec4f(c * 0.01, 0.3, 0.5, 1); }` });
const pipeline = device.createRenderPipeline({ layout: "auto", vertex: { module }, fragment: { module, targets: [{ format }] } });
const ubo = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const bg = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubo } }] });
function frame(t) {
  device.queue.writeBuffer(ubo, 0, new Float32Array([t * 0.001, 0, 0, 0]));
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipeline); if (!BROKEN) pass.setBindGroup(0, bg); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
