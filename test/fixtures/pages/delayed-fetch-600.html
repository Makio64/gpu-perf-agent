<!doctype html><html><head><meta charset="utf-8"><title>delayed-fetch-600</title></head><body><canvas width="256" height="256"></canvas>
<script>
// Fetched after load; the warmup must extend until it finishes (>= 600 ms).
addEventListener("load", () => fetch("/delayed?ms=600").then(r => r.json()).then(v => { globalThis.delayedDone = v; }));
const gl = document.querySelector("canvas").getContext("webgl2");
function frame() { gl.clearColor(Math.random(), 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); requestAnimationFrame(frame); }
frame();
</script></body></html>
