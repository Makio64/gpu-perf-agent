<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>GPU-bound 25 ms</title></head>
<body style="margin:0;background:#000">
<canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
// One render pass whose fragment loop costs about 25 ms of GPU time per frame at 1280x720 on an M-series GPU.
// Used by the L1a overhead gate (gpuTiming on vs off). Override the loop count with ?iters=N.
const iters = Number(new URLSearchParams(location.search).get("iters")) || 5600;
const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
const device = await adapter.requestDevice();
const canvas = document.getElementById("c");
canvas.width = innerWidth * devicePixelRatio;
canvas.height = innerHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format, alphaMode: "opaque" });
const module = device.createShaderModule({ label: "loop", code: `
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
  return vec4f(p[i], 0, 1);
}
@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  var v = pos.xy * 0.001;
  for (var i = 0; i < ${iters}; i++) { v = vec2f(sin(v.x * 1.1 + v.y), cos(v.y * 0.9 - v.x)); }
  return vec4f(v, 0.5, 1);
}` });
const pipeline = device.createRenderPipeline({ label: "loop", layout: "auto", vertex: { module }, fragment: { module, targets: [{ format }] } });
function frame() {
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({ label: "main", colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipeline);
  pass.draw(3);
  pass.end();
  device.queue.submit([encoder.finish()]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
