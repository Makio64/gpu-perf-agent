<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="c" width="512" height="512"></canvas><script type="module">
// Simulates shader compilation / asset decode after load: no network, so network-idle does not cover it.
await new Promise(r => setTimeout(r, 1500));
const gl = document.getElementById("c").getContext("webgl2");
function loop() { const t0 = performance.now(); while (performance.now() - t0 < 12) {} for (let i = 0; i < 200; i++) gl.drawArrays(gl.POINTS, 0, 1); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
